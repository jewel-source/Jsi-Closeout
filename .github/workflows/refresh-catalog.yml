name: Refresh catalog

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_photo_refresh:
        description: "Ignore cached photo matches and re-search Immich for every style"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Import catalog
        env:
          SEAFILE_SERVER_URL: ${{ secrets.SEAFILE_SERVER_URL }}
          SEAFILE_REPO_ID: ${{ secrets.SEAFILE_REPO_ID }}
          SEAFILE_FOLDER_PATH: ${{ secrets.SEAFILE_FOLDER_PATH }}
          SEAFILE_API_TOKEN: ${{ secrets.SEAFILE_API_TOKEN }}
          SEAFILE_USERNAME: ${{ secrets.SEAFILE_USERNAME }}
          SEAFILE_PASSWORD: ${{ secrets.SEAFILE_PASSWORD }}
          IMMICH_BASE_URL: ${{ secrets.IMMICH_BASE_URL }}
          IMMICH_API_KEY: ${{ secrets.IMMICH_API_KEY }}
          MAX_PHOTOS_PER_ITEM: ${{ secrets.MAX_PHOTOS_PER_ITEM }}
          IMMICH_THUMBNAIL_SIZE: ${{ secrets.IMMICH_THUMBNAIL_SIZE }}
          FORCE_PHOTO_REFRESH: ${{ inputs.force_photo_refresh || 'false' }}
        run: npm run import-catalog

      - name: Commit refreshed catalog if changed
        run: |
          if git diff --quiet -- src/data/catalog.json; then
            echo "No catalog changes today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog.json
          git commit -m "chore: daily catalog refresh"
          git push
